<!DOCTYPE html>
<html lang="en">
<head>

  <title>Gemma Petrie</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a1a1a'/><text x='16' y='22' text-anchor='middle' font-size='18' font-family='Georgia,serif' fill='%23fff'>g</text></svg>"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, sans-serif; background: #fafafa; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }

    .grid { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
    a { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #fff; border: 1px solid #ebebeb; border-radius: 8px; text-decoration: none; color: #1a1a1a; font-size: 13px; font-weight: 600; transition: border-color 0.1s, box-shadow 0.1s; }
    a:hover { border-color: #1a1a1a; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .arrow { color: #ccc; font-size: 16px; font-weight: 300; }
  </style>
</head>

  <div class="grid">
